name: Chapter 3 verbal audit export

on:
  push:
    paths:
      - ".github/workflows/ch3-verbal-audit-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export compact cards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const input = 'src/data/flashcardsChemCh3AhmedNadawiEn.text.json';
          const cards = JSON.parse(fs.readFileSync(input, 'utf8'));
          const compact = cards.map(({answerBlocks, ...card}) => card);
          fs.mkdirSync('audit-output', {recursive: true});
          fs.writeFileSync('audit-output/ch3-cards-compact.json', JSON.stringify(compact, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ch3-cards-compact
          path: audit-output/ch3-cards-compact.json
          retention-days: 1
