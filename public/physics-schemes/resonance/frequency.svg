49" stroke="#59d8fa" stroke-opacity=".45" stroke-width="2"></rect><text x="480" y="434" text-anchor="middle" font-size="45" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" fill="#edf6ff">ωr² L C = 1</text></g></g><g opacity="1"><g><rect x="110" y="482" width="740" height="85" rx="22" fill="#102b49" stroke="#59d8fa" stroke-opacity=".45" stroke-width="2"></rect><text x="480" y="538" text-anchor="middle" font-size="45" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" fill="#ffcf79">ωr = 1 / √(LC)</text></g></g><text x="480" y="661" text-anchor="middle" font-size="42" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" fill="#ffcf79">fr = ωr / (2π) = 1 / [2π√(LC)]</text></svg>