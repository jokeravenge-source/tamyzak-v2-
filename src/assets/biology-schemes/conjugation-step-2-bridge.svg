  <g fill="#5eead4" fill-opacity=".3" stroke="#99f6e4" stroke-width="7"><rect x="80" y="165" width="245" height="140" rx="70"/><rect x="475" y="165" width="245" height="140" rx="70"/></g>
  <circle cx="205" cy="235" r="37" fill="none" stroke="#fbbf24" stroke-width="9"/><path d="M325 235H475" stroke="#fb7185" stroke-width="18" stroke-linecap="round"/><path d="M325 235H475" stroke="#fecdd3" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" fill="#fff"><text x="400" y="55" text-anchor="middle" font-size="30" font-weight="700">2 · CONJUGATION BRIDGE</text><text x="202" y="143" text-anchor="middle" font-size="20">Donor</text><text x="598" y="143" text-anchor="middle" font-size="20">Recipient</text><text x="400" y="215" text-anchor="middle" font-size="17">Bridge</text><text x="400" y="397" text-anchor="middle" font-size="22">The bridge binds the protoplasm of both cells</text></g>
