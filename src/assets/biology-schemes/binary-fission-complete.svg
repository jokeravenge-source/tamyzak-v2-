  <g transform="translate(570 245)"><rect x="-145" y="-72" width="290" height="144" rx="72" fill="#34d399" opacity=".3" stroke="#6ee7b7" stroke-width="8"/><path d="M-78 0c28-55 56 55 84 0s56 55 84 0" fill="none" stroke="#ddd6fe" stroke-width="9"/></g>
