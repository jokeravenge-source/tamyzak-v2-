<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Result of bacterial conjugation</title><desc id="desc">Both bacteria contain fertility factors, while only part of the genetic material was transferred</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs>
  <rect width="800" height="450" rx="32" fill="url(#bg)"/>
  <g fill="#5eead4" fill-opacity=".3" stroke="#99f6e4" stroke-width="7"><rect x="80" y="155" width="270" height="160" rx="80"/><rect x="450" y="155" width="270" height="160" rx="80"/></g>
  <g fill="none" stroke-linecap="round"><path d="M115 235c30-52 58 52 88 0s58 52 88 0" stroke="#c4b5fd" stroke-width="8"/><path d="M485 235c30-52 58 52 88 0s58 52 88 0" stroke="#c4b5fd" stroke-width="8"/><circle cx="285" cy="190" r="25" stroke="#fbbf24" stroke-width="7"/><circle cx="655" cy="190" r="25" stroke="#fbbf24" stroke-width="7"/></g>
  <g font-family="Arial,sans-serif" fill="#fff"><text x="400" y="55" text-anchor="middle" font-size="30" font-weight="700">6 · CONJUGATION RESULT</text><text x="400" y="365" text-anchor="middle" font-size="21">Only part of the genetic material is transferred</text><text x="400" y="397" text-anchor="middle" font-size="19">The new bacterium does not receive complete genes from both cells</text></g>
</svg>