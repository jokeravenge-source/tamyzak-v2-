<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Both cells contain plasmids</title><desc id="desc">After replication, both bacterial cells possess the fertility factor or plasmid</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#14532d"/></linearGradient></defs>
  <rect width="800" height="450" rx="32" fill="url(#bg)"/>
  <g fill="#5eead4" fill-opacity=".3" stroke="#99f6e4" stroke-width="7"><rect x="90" y="165" width="260" height="145" rx="73"/><rect x="450" y="165" width="260" height="145" rx="73"/></g>
  <circle cx="220" cy="237" r="42" fill="none" stroke="#fbbf24" stroke-width="9"/><circle cx="580" cy="237" r="42" fill="none" stroke="#fbbf24" stroke-width="9"/>
  <g font-family="Arial,sans-serif" fill="#fff"><text x="400" y="55" text-anchor="middle" font-size="30" font-weight="700">5 · BOTH CELLS HAVE THE F FACTOR</text><text x="220" y="243" text-anchor="middle" font-size="17">Plasmid</text><text x="580" y="243" text-anchor="middle" font-size="17">Plasmid</text><text x="400" y="397" text-anchor="middle" font-size="22">The donor is restored and both cells possess the plasmid</text></g>
</svg>